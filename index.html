<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Das große Bauern- und Schmiedewissen-Quiz</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f1ea;
            color: #2c221e;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .quiz-container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 700px;
            padding: 30px;
            border: 2px solid #d5c8b5;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: #4a5d4e;
            text-align: center;
        }
        .subtitle {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 20px;
            text-align: center;
        }
        .audio-control-bar {
            background: #faf8f5;
            border: 1px solid #d5c8b5;
            border-radius: 8px;
            padding: 10px 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            font-weight: 500;
        }
        .audio-btn {
            background-color: #4a5d4e;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: bold;
        }
        .audio-btn:hover {
            background-color: #3b4b3e;
        }
        .question-counter {
            font-size: 0.9rem;
            font-weight: bold;
            color: #8c7a6b;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #faf8f5;
            border: 2px solid #d5c8b5;
            border-radius: 10px;
            padding: 14px 18px;
            font-size: 1.05rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #2c221e;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .option-number {
            background-color: #d5c8b5;
            color: #2c221e;
            font-weight: bold;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.95rem;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #f0ebe1;
            border-color: #4a5d4e;
        }
        .option-btn.correct {
            background-color: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724;
            font-weight: bold;
        }
        .option-btn.correct .option-number {
            background-color: #28a745;
            color: white;
        }
        .option-btn.incorrect {
            background-color: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24;
        }
        .option-btn.incorrect .option-number {
            background-color: #dc3545;
            color: white;
        }
        .feedback-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            font-size: 1rem;
            display: none;
            line-height: 1.4;
        }
        .feedback-box.show {
            display: block;
        }
        .feedback-box.correct-fb {
            background-color: #e2f0d9;
            color: #274e13;
            border: 1px solid #b6d7a8;
        }
        .feedback-box.incorrect-fb {
            background-color: #fce4d6;
            color: #a64d79;
            border: 1px solid #f4cccc;
        }
        .next-btn {
            background-color: #4a5d4e;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            display: none;
        }
        .next-btn:hover {
            background-color: #3b4b3e;
        }
        .results-container {
            text-align: center;
            display: none;
        }
        .results-container h2 {
            font-size: 2rem;
            color: #4a5d4e;
            margin-bottom: 15px;
        }
        .results-container p {
            font-size: 1.2rem;
            margin-bottom: 25px;
        }
        .restart-btn {
            background-color: #4a5d4e;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-box">
        <h1>Altes Bauern- und Schmiedewissen</h1>
        <div class="subtitle">Fragen zu Feld, Hof, Schmiedehandwerk und Situationsentscheidungen</div>
        
        <div class="audio-control-bar">
            <span>🎶 Hintergrundmusik:</span>
            <button class="audio-btn" id="bg-audio-btn" onclick="toggleBackgroundMusic()">Musik an</button>
        </div>

        <div class="question-counter" id="counter">Frage 1 von 10</div>
        <div class="question-text" id="question">Lade Frage...</div>
        <div class="options-grid" id="options"></div>
        <div class="feedback-box" id="feedback"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Nächste Frage</button>
    </div>

    <div class="results-container" id="results">
        <h2>Geschafft!</h2>
        <p id="score-text"></p>
        <button class="restart-btn" onclick="restartQuiz()">Quiz noch einmal spielen</button>
    </div>
</div>

<script>
    let audioCtx = null;
    let bgMusicInterval = null;
    let isMusicPlaying = false;

    // Verbesserte, kräftigere Sounds für richtig und falsch
    function playSound(type) {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const now = audioCtx.currentTime;

            if (type === 'correct') {
                // Fröhlicher, klarer Dreiklang (heller und gut hörbar)
                [523.25, 659.25, 783.99].forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    const startTime = now + (index * 0.08);
                    gain.gain.setValueAtTime(0.25, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);
                    osc.start(startTime);
                    osc.stop(startTime + 0.3);
                });
            } else {
                // Tieferer, satter Brumm-Ton bei falscher Antwort
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(130.81, now); // C3
                osc.frequency.setValueAtTime(98.00, now + 0.15); // G2
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        } catch (e) {
            console.log("Audio nicht unterstützt", e);
        }
    }

    // Dezente Hintergrundmelodie
    function toggleBackgroundMusic() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        const btn = document.getElementById('bg-audio-btn');

        if (isMusicPlaying) {
            clearInterval(bgMusicInterval);
            bgMusicInterval = null;
            isMusicPlaying = false;
            btn.innerText = "Musik an";
            btn.style.backgroundColor = "#4a5d4e";
        } else {
            isMusicPlaying = true;
            btn.innerText = "Musik aus";
            btn.style.backgroundColor = "#a64d79";

            const chords = [
                [261.63, 329.63, 392.00], // C-Dur
                [220.00, 261.63, 329.63], // A-Moll
                [174.61, 220.00, 261.63], // F-Dur
                [196.00, 246.94, 293.66]  // G-Dur
            ];
            let chordIndex = 0;

            bgMusicInterval = setInterval(() => {
                if (!isMusicPlaying) return;
                try {
                    const currentChord = chords[chordIndex];
                    chordIndex = (chordIndex + 1) % chords.length;

                    currentChord.forEach(freq => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.value = freq;
                        
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);

                        const now = audioCtx.currentTime;
                        gain.gain.setValueAtTime(0.02, now);
                        gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.5);
                        
                        osc.start(now);
                        osc.stop(now + 3.5);
                    });
                } catch(e) {}
            }, 4000);
        }
    }

    // Gesamter Fragenpool
    const allQuestions = [
        // Schmiede & Pflüge
        { question: "Was machte der Schmied traditionell mit einer abgenutzten oder stumpfen Pflugschar?", options: ["Er warf sie sofort weg", "Er schärfte und hämmerte sie im heißen Zustand in der Feldschmiede wieder aus", "Er goss sie komplett neu aus Plastik", "Er strich sie mit Öl an"], correct: 1, explanation: "Richtig! Die Pflugschar wurde im Feuer erhitzt und auf dem Amboss vom Schmied fachmännisch ausgeschmiedet und nachgeschärft." },
        { question: "Wofür wurde der Amboss in der Dorfschmiede hauptsächlich verwendet?", options: ["Als Sitzgelegenheit für den Meister", "Als massive, stählerne Unterlage zum Bearbeiten, Schmieden und Biegen von glühendem Eisen", "Zum Aufbewahren von Hufeisen", "Als Messgerät für Getreide"], correct: 1, explanation: "Richtig! Der Amboss ist das Herzstück der Schmiede, das den Wumms der Hammerschläge aufnimmt." },
        { question: "Welches Gerät nutzte der Schmied, um das Feuer in der Feldesse kräftig anzufachen?", options: ["Einen Fächer", "Den Blasebalg (oder ein elektrisches Windgebläse)", "Einen Wassereimer", "Einen großen Holzdeckel"], correct: 1, explanation: "Richtig! Durch das Einblasen von Luft mit dem Blasebalg stieg die Temperatur in der Esse so stark an, dass Eisen glühte." },
        { question: "Warum musste der Schmied ein glühendes Hufeisen oder Werkstück nach der Bearbeitung im Wasser ‚abschrecken‘?", options: ["Damit es sofort wieder weich wird", "Um das Metall durch schnelles Abkühlen zu härten", "Damit es nicht rostet", "Um den Ruß abzuwaschen"], correct: 1, explanation: "Richtig! Das Abschrecken in Wasser verändert die Kristallstruktur des Stahls und sorgt für die nötige Härte." },
        { question: "Was verstand man unter dem ‚Zunder‘ in der Schmiede?", options: ["Teure Schmiedekohle", "Die abfallende Metalloxidschicht, die beim Hämmern von glühendem Eisen abplatzt", "Ein spezielles Werkzeug zum Messen", "Das Bier des Schmieds"], correct: 1, explanation: "Richtig! Beim Erhitzen und Schlagen bildet sich Zunder auf der Eisenoberfläche." },
        { question: "Welches Handwerk war für das Aufbringen von Eisenreifen auf hölzerne Wagenräder zuständig?", options: ["Der Stellmacher (Wagner) zusammen mit dem Schmied", "Der Müller", "Der Bäcker", "Der Schuster"], correct: 0, explanation: "Richtig! Der Wagner baute das Holzrad, und der Schmied schrumpfte den glühenden Eisenreifen passgenau auf." },
        { question: "Wie nannte man den schweren Hammer des Schmieds, den er meist mit beiden Händen schwang?", options: ["Den Schlegel oder Vorschlaghammer", "Den Uhrmacherhammer", "Den kleinen Nagelhammer", "Die Kneifzange"], correct: 0, explanation: "Richtig! Der Vorschlaghammer wurde für schwere Verformungsarbeiten am Amboss gebraucht." },
        { question: "Warum schärfte man Pflugscharen und Eggenzinken regelmäßig beim Schmied?", options: ["Damit der Schlepper weniger Sprit verbraucht", "Weil stumpfe Scharen den Boden nur verdichten statt ihn sauber zu schneiden und zu wenden", "Damit sie im Dunkeln leuchten", "Nur zur Traditionspflege"], correct: 1, explanation: "Richtig! Eine scharfe Pflugschar schneidet leicht durch die Scholle und spart Zugkraft." },

        // Situationsentscheidungen
        { question: "Du willst am Morgen Heu machen und einfahren, aber der Wetterbericht meldet für den späten Nachmittag unbeständigen Regen. Wie gehst du vor?", options: ["Trotzdem mähen und hoffen", "Den Schnitt auf den nächsten Sonnentag verschieben, da feuchtes Heu im Stock verdirbt", "Nur im Schatten mähen", "Das Gras sofort anzünden"], correct: 1, explanation: "Richtig! Feuchtes Heu schimmelt im Stock oder kann sich durch Gärung entzünden. Bei Regengefahr wird nicht gemäht." },
        { question: "Du arbeitest auf dem Feld und am Horizont türmen sich bedrohliche Gewitterwolken auf. Was machst du mit dem Schlepper oder Metallgeräten?", options: ["Sich unter einzeln stehende Eichen stellen", "Unbeirrt weiterarbeiten", "Sofort offene Metallgeräte und den Schlepper verlassen und Schutz in einem Gebäude oder einer Senke suchen", "Sich auf den Metallwagen setzen"], correct: 2, explanation: "Richtig! Einzelbäume ziehen Blitze an, und auf offenem Feld mit Metallgeräten herrscht Lebensgefahr." },
        { question: "Die Kühe stehen auf der Weide, als ein heftiger Hagelsturm mit eisigem Wind einbricht. Was tust du?", options: ["Sie sich selbst überlassen", "Den Stall öffnen, falls nah, oder prüfen, ob sie natürlichen Schutz unter Bäumen finden", "Sie mit Steinen auseinandertreiben", "Sie einzeln nach Hause treiben"], correct: 1, explanation: "Richtig! Bei Hagel und Panik suchen Tiere Schutz; wenn möglich, öffnet man den Stall oder prüft Unterstände." },
        { question: "Nach starkem Dauerregen läuft Wasser in den alten Keller, in dem Kartoffeln lagern. Was ist die allererste Sofortmaßnahme?", options: ["Sofort das Licht einschalten", "Die elektrischen Sicherungen für den Kellerbereich ausschalten, um einen Kurzschluss zu verhindern", "Die Kartoffeln wegwerfen", "Mit einer defekten Pumpe arbeiten"], correct: 1, explanation: "Richtig! Wenn Wasser auf Steckdosen trifft, droht tödlicher Stromschlag. Zuerst den Strom ausschalten!" },
        { question: "Du willst Stalldung ausmisten, aber die Gabel verhakt sich im harten Untergrund. Wie löst du das ergonomisch?", options: ["Mit voller Wucht am Stiel reißen bis er bricht", "Mit dem Fuß nachhelfen und das Material mit einem kurzen, kontrollierten Hebel aus den Gelenken lösen", "Mit bloßen Händen graben", "Wasser in den Stall kippen"], correct: 1, explanation: "Richtig! Wer aus dem Rücken statt aus den Beinen hebt, riskiert sofort einen Hexenschuss." },
        { question: "Der Wetterdienst meldet Spätfrost für eine klare Nacht, und die Apfelbäume blühen bereits. Was konnte man traditionell tun?", options: ["Die Bäume mit eiskaltem Wasser abspritzen", "Kleinere Feuer (Frostfeuer) in den Baumgassen anzünden, um kalte Luftschichten zu durchbrechen", "Alle Äste absägen", "Die Blüten mit Erde bewerfen"], correct: 1, explanation: "Richtig! Frostfeuer oder Räuchern waren klassische Mittel gegen das Absinken der Frostluft." },
        { question: "Im Wald hast du Rundholz aufgeschichtet, aber der Stapel fängt an, nach vorne zu rutschen. Was tust du auf gar keinen Fall?", options: ["Sich in den Gefahrenbereich vor den rutschenden Stapel stellen, um ihn aufzuhalten", "Sofort zur Seite springen", "Den Stapel sich selbst überlassen", "Weglaufen"], correct: 0, explanation: "Richtig! Niemals versuchen, einen rollenden Holzstapel mit Muskelkraft aufzuhalten – das führt zu schwersten Quetschungen." },
        { question: "Ein neugeborenes Kalb trinkt am ersten Tag nicht bei der Mutter. Wie reagiert der erfahrene Landwirt?", options: ["Bis zum nächsten Tag warten", "Sofort die lebenswichtige Biestmilch (Colostrum) sichern und notfalls mit der Flasche eingeben", "Das Kalb aus dem Stall werfen", "Ihm Leitungswasser geben"], correct: 1, explanation: "Richtig! Ohne die Antikörper aus der Kolostralmilch hat das Kalb keine Immunabwehr." },
        { question: "Die Sense zieht nicht mehr richtig und knickt das Gras nur ab. Was ist zu tun?", options: ["Noch fester drücken und rennen", "Die Sense mit dem Wetzstein im Feld abziehen und schärfen", "Das Sensenblatt wegwerfen", "Den Holzstiel austauschen"], correct: 1, explanation: "Richtig! Wenn die Schneide stumpf wird, hilft nur das regelmäßige Abziehen mit dem Wetzstein." },
        { question: "Bei der Feldarbeit fängt der Kühler des alten Schleppers an zu kochen. Wie verhält man sich?", options: ["Sofort den heißen Kühlerdeckel mit bloßen Händen aufreißen", "Den Motor im Leerlauf etwas weiterlaufen lassen und keinesfalls sofort den heißen Druckdeckel öffnen", "Eiswasser in den heißen Motor schütten", "Vollgas geben"], correct: 1, explanation: "Richtig! Durch Druck kocht das Wasser; reißt man den Deckel auf, explodiert Dampf ins Gesicht. Abkühlen lassen!" },

        // Flächenmaße & Maße
        { question: "Wie viele Quadratmeter (m²) entsprechen genau 30 Hektar (ha)?", options: ["3.000 m²", "30.000 m²", "300.000 m²", "3.000.000 m²"], correct: 2, explanation: "Richtig! 1 Hektar sind 10.000 m², folglich sind 30 Hektar 300.000 m²." },
        { question: "Wie viel sind 50 Hektar in Ar (a) umgerechnet?", options: ["50 Ar", "500 Ar", "5.000 Ar", "50.000 Ar"], correct: 2, explanation: "Richtig! 1 Hektar sind 100 Ar. 50 Hektar ergeben 5.000 Ar." },
        { question: "Wie viele Hektar entsprechen 100.000 Quadratmetern?", options: ["1 Hektar", "10 Hektar", "100 Hektar", "1.000 Hektar"], correct: 1, explanation: "Richtig! 10.000 m² sind 1 Hektar, also sind 100.000 m² genau 10 Hektar." },
        { question: "Was entsprach im hessischen Raum historisch grob einem ‚Morgen‘ Land?", options: ["Etwa 250 m²", "Etwa 2.500 m²", "Genau 10.000 m²", "Einen halben Hektar"], correct: 1, explanation: "Richtig! Ein Morgen war die Fläche, die ein Gespann an einem Vormittag pflügen konnte (ca. 2.500 m²)." },
        { question: "Wie viele Quadratmeter hat ein ‚Ar‘ (a)?", options: ["10 m²", "100 m²", "1.000 m²", "10.000 m²"], correct: 1, explanation: "Richtig! Ein Ar entspricht genau 100 Quadratmetern (10m x 10m)." },
        { question: "Wenn ein Acker 4 Hektar groß ist, wie viele Ar sind das?", options: ["40 Ar", "400 Ar", "4.000 Ar", "40.000 Ar"], correct: 1, explanation: "Richtig! 1 Hektar = 100 Ar, also haben 4 Hektar genau 400 Ar." },
        { question: "Was ist ein ‚Klafter‘ in alten Maßen traditionell gewesen?", options: ["Ein Gewichtsmaß für Getreide", "Ein Längen- oder Volumenmaß (Abstand der ausgestreckten Arme)", "Eine alte Steuer auf Schweine", "Die Tiefe eines Brunnens"], correct: 1, explanation: "Richtig! Ein Klafter bezeichnete oft den Abstand der ausgestreckten Arme oder ein Raummaß für Holz." },
        { question: "Wie viel Kubikmeter (m³) sind 10 Festmeter reines Holz grob?", options: ["Genau 5 m³", "Genau 10 m³", "Genau 15 m³", "Etwa 20 m³"], correct: 1, explanation: "Richtig! Ein Festmeter entspricht exakt 1 Kubikmeter fester Holzmasse ohne Rinde und Zwischenräume." },
        { question: "Was ist der Hauptunterschied zwischen Festmeter (fm) und Raummeter (rm)?", options: ["Festmeter enthält Luftzwischenräume", "Raummeter enthält geschichtetes Rundholz mit Luftzwischenräumen", "Es gibt keinen Unterschied", "Festmeter gilt nur für Nadelholz"], correct: 1, explanation: "Richtig! Der Raummeter misst den Stapel inklusive Luftzwischenräume, der Festmeter nur das reine Holzvolumen." },

        // Forstwirtschaft & Holz
        { question: "Was versteht man unter einem ‚Raummeter‘ (rm) geschichtetem Holz?", options: ["1 m³ reines Holz ohne Rinde", "1 m³ geschichtetes Rundholz inklusive Luftzwischenräume", "100 Ster", "Ein Holzstapel von 5 Metern Länge"], correct: 1, explanation: "Richtig! Ein Raummeter ist ein Würfel von 1m x 1m x 1m geschichtetem Holz inklusive Zwischenräumen." },
        { question: "Welches Holz war im bäuerlichen Fachwerkbau wegen seiner Dauerhaftigkeit besonders begehrt?", options: ["Fichte", "Pappel", "Eiche", "Weide"], correct: 2, explanation: "Richtig! Eichenholz ist extrem robust, witterungsbeständig und verrottet im Boden nur sehr langsam." },
        { question: "Wann im Jahr wurden Stämme früher traditionell gefällt (Saftruhe)?", options: ["Im Hochsommer bei voller Blüte", "Im Spätwinter bei Saftruhe des Baumes", "Im Frühregen im April", "Immer an Neumond im Herbst"], correct: 1, explanation: "Richtig! Im Winter ruht der Baum, das Holz enthält weniger Feuchtigkeit und reißt weniger." },
        { question: "Was ist ein ‚Polter‘ im Wald?", options: ["Ein spezielles Fällbeil", "Ein sauber aufgeschichteter Stapel Stammholz am Wegesrand", "Ein forstwirtschaftlicher Weg", "Ein Baumschädling"], correct: 1, explanation: "Richtig! Als Polter bezeichnet man die am Weg aufgeschichteten Holzstämme zum Abtransport." },
        { question: "Welcher Baum hat die botanische Bezeichnung *Fagus sylvatica* und prägt viele deutsche Mittelgebirge?", options: ["Fichte", "Rotbuche", "Stieleiche", "Gemeine Kiefer"], correct: 1, explanation: "Richtig! Fagus sylvatica ist die Rotbuche, der klassische Laubbaum unserer heimischen Wälder." },
        { question: "Was bedeutet das ‚Durchforsten‘ eines Waldes?", options: ["Komplettes Roden aller Bäume", "Entfernen kranker oder schwächerer Bäume, damit die starken mehr Licht bekommen", "Neupflanzung von Sträuchern", "Anlegen von Gräben"], correct: 1, explanation: "Richtig! Bei der Durchforstung wird der Bestand gepflegt und ausgedünnt." },
        { question: "Welches Werkzeug wurde früher zum manuellen Ablängen von dicken Stämmen im Wald von zwei Männern genutzt?", options: ["Bügelsäge", "Schrotsäge / Zugsäge", "Astschere", "Beil"], correct: 1, explanation: "Richtig! Die Schrotsäge wurde von zwei Holzhauern im Wechsel gezogen." },
        { question: "Was ist ‚Schlagabraum‘ im Wald?", options: ["Geklautes Holz", "Astwerk und Wipfelholz, das nach der Holzernte zurückbleibt", "Die Rinde", "Sägemehl"], correct: 1, explanation: "Richtig! Schlagabraum sind die Reste, die traditionell als Leseholz gesammelt werden durften." },
        { question: "Welches Tier gilt im Wald als wichtigster natürlicher Verjüngungshelfer für Eichen?", options: ["Das Wildschwein", "Der Eichelhäher", "Der Fuchs", "Das Eichhörnchen"], correct: 1, explanation: "Richtig! Der Eichelhäher versteckt Tausende Eichelvorräte und vergisst viele davon, woraus Eichen wachsen." },

        // Feldbau & Ackerbau
        { question: "Was bedeutet es, wenn ein Acker in der Dreifelderwirtschaft ‚brachlag‘?", options: ["Er wurde mit Steinen bedeckt", "Er wurde ein Jahr lang nicht besät, damit sich der Boden erholen konnte", "Er wurde geflutet", "Er wurde mit Klee bepflanzt"], correct: 1, explanation: "Richtig! Die Brache diente der Regeneration der Nährstoffe und der Unkrautbekämpfung." },
        { question: "Welches alte Gerät diente zum Zerkleinern der Erdklumpen nach dem Pflügen?", options: ["Die Egge", "Die Sichel", "Der Pflug", "Die Hacke"], correct: 0, explanation: "Richtig! Die Egge wurde über den gepflugten Acker gezogen, um das Saatbett zu ebnen." },
        { question: "Warum pflügten die Bauern im späten Herbst die Felder oft in ‚Winterfurche‘ um?", options: ["Damit der Frost die groben Erdschollen sprengt und feine Krume entsteht", "Damit Wasser im Sommer abfließt", "Um Mäuse anzulocken", "Um Steine nach oben zu holen"], correct: 0, explanation: "Richtig! Der Frost sprengt die Schollen auf, sodass im Frühjahr ein feinkrümeliges Saatbett entsteht." },
        { question: "Was ist Mist (Stalldung) traditionell für die Landwirtschaft?", options: ["Unnötiger Abfall", "Wertvoller organischer Dünger aus Kot, Urin und Stroh", "Nur Tierfutter", "Ein Pflanzenschutzmittel"], correct: 1, explanation: "Richtig! Stalldung liefert wichtige Nährstoffe und wertvollen Humus für den Boden." },
        { question: "Welche Fruchtfolge war typisch für die klassische Dreifelderwirtschaft?", options: ["Kartoffeln – Mais – Weizen", "WinterGetreide – SommerGetreide – Brache", "Nur Weizen jedes Jahr", "Klee – Rüben – Roggen"], correct: 1, explanation: "Richtig! Winterung, Sommerung und Brache wechselten sich im Dreijahresrhythmus ab." },
        { question: "Was versteht man unter ‚Dengeln‘ bei der Sense?", options: ["Das Schleifen mit Stein", "Das hämmernde Verdichten und Ausdünnen der Schneide auf dem Dengelstock", "Das Ölen", "Das Spannen"], correct: 1, explanation: "Richtig! Durch das Dengeln wird die Schneide hauchdünn ausgeschmiedet." },
        { question: "Wofür wurde der Worb (Sensenbaum) traditionell genutzt?", options: ["Als Haltegriff für den Pflug", "Als geschwungener Holzstiel für das Sensenblatt", "Als Dreschflegelschaft", "Als Zaunpfahl"], correct: 1, explanation: "Richtig! Der Worb ist der ergonomisch geformte Holzstiel der Sense." },
        { question: "Was ist das ‚Dreschen‘ von Getreide?", options: ["Das Säen", "Das Trennen der Körner von den Ähren und der Spreu", "Das Mahlen", "Das Backen"], correct: 1, explanation: "Richtig! Beim Dreschen werden die Getreidekörner aus der Hülle gelöst." },

        // Viehzucht & Hof
        { question: "Wie nennt man das weibliche Rind, das noch kein Kalb hatte?", options: ["Kuh", "Färse (oder Kalbe)", "Bulle", "Ochse"], correct: 1, explanation: "Richtig! Eine Färse ist eine weibliche, noch nicht gekalbte Rinderin." },
        { question: "Was ist ein kastriertes männliches Rind, das früher als Zugtier diente?", options: ["Ein Bulle", "Ein Ochse", "Ein Stier", "Ein Kalb"], correct: 1, explanation: "Richtig! Der Ochse ist ein kastriertes Rind, das wegen seiner Ausgeglichenheit als Arbeitstier geschätzt wurde." },
        { question: "Welche Tiere wurden auf dem Bauernhof traditionell als ‚Mistmacher‘ bezeichnet?", options: ["Gänse", "Schweine", "Ziegen", "Bienen"], correct: 1, explanation: "Richtig! Schweine wühlten viel und lieferten durch ihren Strohbedarf und Kot exzellenten Stallmist." },
        { question: "Wie viele Mägen hat ein Wiederkäuer wie die Hauskuh?", options: ["Einen", "Zwei", "Drei", "Vier"], correct: 3, explanation: "Richtig! Sie besitzen Pansen, Netzmagen, Blättermagen und Labmagen." },
        { question: "Wann gibt eine Kuh Milch?", options: ["Immer ab dem ersten Jahr", "Nur nach dem Kalben (Laktation)", "Im Winter gar nicht", "Nur bei Kraftfutter"], correct: 1, explanation: "Richtig! Milchproduktion setzt wie bei allen Säugetieren die Geburt eines Kalbes voraus." },
        { question: "Wie nannte man das traditionelle schwere Zugpferd auf vielen Höfen?", options: ["Vollblut", "Kaltblüter (schwere Arbeitspferde)", "Pony", "Shetty"], correct: 1, explanation: "Richtig! Schwere Kaltblüter zogen Pflüge und schwere Erntewagen." },

        // Obstbau, Garten & Traditionen
        { question: "Was ist der traditionelle Sinn des ‚Kronenschnitts‘ bei Apfelbäumen im Spätwinter?", options: ["Den Baum zu töten", "Licht in die Krone zu lassen, altes Holz zu entfernen und den Ertrag zu sichern", "Die Rinde schützen", "Wurzeln stärken"], correct: 1, explanation: "Richtig! Der fachgerechte Winterschnitt sorgt für gesunde Bäume und gute Ernte." },
        { question: "Was ist eine ‚Streuobstwiese‘?", options: ["Ein gedüngter Plantagen-Acker", "Eine traditionelle Form mit hochstämmigen, verstreuten Obstbäumen verschiedener Sorten", "Ein reiner Beerengarten", "Ein abgeholzter Wald"], correct: 1, explanation: "Richtig! Streuobstwiesen sind artenreiche, ökologische Kulturlandschaften." },
        { question: "Was machte man im Herbst traditionell mit Äpfeln, die nicht gelagert werden konnten?", options: ["Weggeworfen", "Zur Mosterei gebracht und zu Apfelwein oder Saft gepresst", "Verbrannt", "An Fische verfüttert"], correct: 1, explanation: "Richtig! Das Mosten war im Herbst ein zentraler Arbeitsgang." },
        { question: "Welches legendäre deutsche Traktormodell wurde von Lanz in Mannheim gebaut?", options: ["Lanz Bulldog", "Porsche Diesel", "Fendt Dieselross", "Deutz Traktor"], correct: 0, explanation: "Richtig! Der Lanz Bulldog mit Glühkopfmotor war jahrzehntelang der Inbegriff des Treckers." },
        { question: "Was verstand man früher unter dem ‚Frondienst‘?", options: ["Freiwillige Nachbarschaftshilfe", "Unbezahlte Arbeitsleistungen, die Bauern für den Grundherrn leisten mussten", "Wehrdienst", "Ferienarbeit"], correct: 1, explanation: "Richtig! Frondienste waren historische Pflichtarbeiten für den Grundbesitzer." },
        { question: "Welches Handwerk war auf dem Dorf neben der Landwirtschaft für Zugtiere und Geräte unverzichtbar?", options: ["Der Bäcker", "Der Hufschmied", "Der Schneider", "Der Uhrmacher"], correct: 1, explanation: "Richtig! Der Schmied war für Pferde, Ochsen und eiserne Ackergeräte überlebenswichtig." }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;
    let quizQuestions = [];

    function initQuiz() {
        let shuffled = [...allQuestions].sort(() => 0.5 - Math.random());
        quizQuestions = shuffled.slice(0, 10); // Exakt 10 Fragen pro Runde
        currentQuestionIndex = 0;
        score = 0;
        document.getElementById('results').style.display = 'none';
        document.getElementById('quiz-box').style.display = 'block';
        loadQuestion();
    }

    function loadQuestion() {
        answered = false;
        const q = quizQuestions[currentQuestionIndex];
        document.getElementById('counter').innerText = `Frage ${currentQuestionIndex + 1} von ${quizQuestions.length}`;
        document.getElementById('question').innerText = q.question;
        
        const optionsContainer = document.getElementById('options');
        optionsContainer.innerHTML = '';
        
        q.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            
            // Nummerierung (1, 2, 3, 4) voranstellen
            const numSpan = document.createElement('span');
            numSpan.className = 'option-number';
            numSpan.innerText = index + 1;
            
            const textSpan = document.createElement('span');
            textSpan.innerText = opt;
            
            btn.appendChild(numSpan);
            btn.appendChild(textSpan);
            
            btn.onclick = () => selectOption(index);
            optionsContainer.appendChild(btn);
        });

        document.getElementById('feedback').className = 'feedback-box';
        document.getElementById('feedback').innerText = '';
        document.getElementById('next-btn').style.display = 'none';
    }

    function selectOption(selectedIndex) {
        if (answered) return;
        answered = true;

        const q = quizQuestions[currentQuestionIndex];
        const buttons = document.getElementsByClassName('option-btn');
        const feedbackBox = document.getElementById('feedback');

        if (selectedIndex === q.correct) {
            buttons[selectedIndex].classList.add('correct');
            feedbackBox.className = 'feedback-box show correct-fb';
            feedbackBox.innerText = q.explanation;
            score++;
            playSound('correct');
        } else {
            buttons[selectedIndex].classList.add('incorrect');
            buttons[q.correct].classList.add('correct');
            feedbackBox.className = 'feedback-box show incorrect-fb';
            feedbackBox.innerText = "Leider nicht ganz richtig. " + q.explanation;
            playSound('incorrect');
        }

        for (let btn of buttons) {
            btn.disabled = true;
        }

        const nextBtn = document.getElementById('next-btn');
        if (currentQuestionIndex < quizQuestions.length - 1) {
            nextBtn.innerText = "Nächste Frage";
        } else {
            nextBtn.innerText = "Ergebnis anzeigen";
        }
        nextBtn.style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizQuestions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('quiz-box').style.display = 'none';
        const resContainer = document.getElementById('results');
        resContainer.style.display = 'block';
        
        let message = `Ergebnis: Du hast ${score} von ${quizQuestions.length} Fragen richtig beantwortet!`;
        if (score === quizQuestions.length) {
            message += " Meisterhaft! Das ist die Höchstpunktzahl – ein wahrer Experte vom Fach!";
        } else if (score >= 7) {
            message += " Hervorragend! Da sitzt das alte Handwerks- und Bauernwissen noch wie früher.";
        } else {
            message += " Schön mitgedacht, das hat richtig Freude gemacht!";
        }
        document.getElementById('score-text').innerText = message;
    }

    function restartQuiz() {
        initQuiz();
    }

    initQuiz();
</script>
